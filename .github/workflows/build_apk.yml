name: Build Android APK (Tu Dong Xuat APK & Version JSON)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Debug APK
        run: |
          gradle clean assembleDebug --stacktrace --refresh-dependencies --console=plain --no-daemon 2>&1 | tee build_log.txt

      - name: Publish Error Directly to Summary
        if: failure()
        run: |
          echo "## ❌ Chi Tiết Lỗi Biên Dịch Từ Trình Biên Dịch" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          tail -n 120 build_log.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Generate OTA Release Files
        run: |
          mkdir -p dist
          echo "Danh sach tat ca cac file apk duoc build ra:"
          find app/build/outputs/ -type f || true
          
          APK_FILE=$(find app/build/outputs/ -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            echo "Tim thay APK tai: $APK_FILE"
            cp "$APK_FILE" dist/iptv-player.apk
            
            SHA256=$(sha256sum dist/iptv-player.apk | awk '{print $1}')
            VERSION_CODE=$(grep "versionCode =" app/build.gradle.kts | head -n 1 | awk '{print $3}')
            VERSION_NAME=$(grep "versionName =" app/build.gradle.kts | head -n 1 | awk '{print $3}' | tr -d '"')
            
            cat <<EOF > dist/version.json
          {
            "versionCode": ${VERSION_CODE:-1},
            "versionName": "${VERSION_NAME:-1.0.0}",
            "apkUrl": "https://raw.githubusercontent.com/${{ github.repository }}/main/dist/iptv-player.apk",
            "sha256": "$SHA256",
            "changeLog": "Bản phát hành tự động qua GitHub Actions CI/CD"
          }
          EOF
            echo "Da tao thanh cong dist/version.json voi SHA-256: $SHA256"
          else
            echo "KHONG TIM THAY FILE APK NAO TRONG app/build/outputs/!"
            exit 1
          fi

      - name: Upload APK and Version Manifest
        uses: actions/upload-artifact@v4
        with:
          name: IPTV-Player-Release
          path: dist/
          if-no-files-found: error
          retention-days: 30
